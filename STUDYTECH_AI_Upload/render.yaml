    name: studytech
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envservices:
  - type: web
    name: studytech
    runtime: node
    rootDir: PUT-YOUR-FOLDER-NAME-HERE
